<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark premium background -->
  <rect width="180" height="180" rx="40" fill="#130F09"/>

  <!-- Subtle gold plate ring -->
  <circle cx="90" cy="90" r="76" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- Fork tines (top 3 prongs) -->
  <rect x="53"  y="28" width="14" height="51" rx="7" fill="url(#g)"/>
  <rect x="83"  y="28" width="14" height="51" rx="7" fill="url(#g)"/>
  <rect x="113" y="28" width="14" height="51" rx="7" fill="url(#g)"/>

  <!-- T crossbar / fork guard -->
  <rect x="34" y="76" width="112" height="14" rx="7" fill="url(#g)"/>

  <!-- T stem / fork handle -->
  <rect x="78" y="90" width="24" height="62" rx="12" fill="url(#g)"/>
</svg>
