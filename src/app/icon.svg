<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark premium background -->
  <rect width="32" height="32" rx="7" fill="#130F09"/>

  <!-- Subtle gold plate ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#ring)" stroke-width="0.8"/>

  <!-- Fork tines (top 3 prongs) -->
  <rect x="9.5"  y="5" width="2.5" height="9" rx="1.25" fill="url(#g)"/>
  <rect x="14.75" y="5" width="2.5" height="9" rx="1.25" fill="url(#g)"/>
  <rect x="20"   y="5" width="2.5" height="9" rx="1.25" fill="url(#g)"/>

  <!-- T crossbar / fork guard -->
  <rect x="6" y="13.5" width="20" height="2.5" rx="1.25" fill="url(#g)"/>

  <!-- T stem / fork handle -->
  <rect x="14" y="16" width="4" height="11" rx="2" fill="url(#g)"/>
</svg>
